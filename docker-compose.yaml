services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_KEY: base64:DFEom8qBOvcKPLZn5WrALGtQAWFhdvMeh+PkAzTTN3s=
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: assets
      DB_USERNAME: assets
      DB_PASSWORD: assets
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DOCS_USERNAME: docs
      DOCS_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: assets
      MYSQL_USER: assets
      MYSQL_PASSWORD: assets
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
